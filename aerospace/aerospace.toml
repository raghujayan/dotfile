# AeroSpace config mirroring the Hyprland binds in ~/.config/hypr/hyprland.conf.
# Install to ~/.aerospace.toml (or ~/.config/aerospace/aerospace.toml) on macOS.
#
# $mod is SUPER on Hyprland. macOS reserves cmd for the system, so alt is used
# here as the equivalent modifier.

config-version = 2
# v2 stops inferring workspaces from the binds; list them explicitly.
persistent-workspaces = ['1', '2', '3', '4', '5']

after-login-command = []
after-startup-command = []
start-at-login = true

# Tell SketchyBar which workspace is focused (step 3 of plan.md).
# Full path so this works regardless of the exec PATH.
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Matches Hyprland: gaps_in = 4, gaps_out = 8
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# --- window rules ----------------------------------------------------------
# Bundle IDs from `aerospace list-apps` where the app was running, else from
# `osascript -e 'id of app "X"'`. NoMachine's session player has no stable
# bundle id (the .app is com.nomachine.nxdock, a helper), so match its name.

# Dialogs and utilities that tile badly: float them.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Stickies'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenSharing'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'NoMachine'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.accessibility.universalAccessAuthWarn'
run = 'layout floating'

# 1: terminals and Docker
[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = 'move-node-to-workspace 1'

# 2: communication
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 2'

# 3: documents
[[on-window-detected]]
if.app-id = 'com.microsoft.Word'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.Powerpoint'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'abnerworks.Typora'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.jgraph.drawio.desktop'
run = 'move-node-to-workspace 3'

# 4: browsers and chat assistants
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.duckduckgo.macos.browser'
run = 'move-node-to-workspace 4'

[key-mapping]
preset = 'qwerty'

[mode.main.binding]

# --- launching -------------------------------------------------------------
# SUPER + Return -> new Ghostty window.
alt-enter = 'exec-and-forget open -na Ghostty'
# SUPER + Space is the app launcher on Hyprland (wofi).
# macOS already owns cmd-space for Spotlight, so no bind here.

# --- window control --------------------------------------------------------
alt-q = 'close'                          # SUPER + Q
alt-v = 'layout floating tiling'         # SUPER + V  toggle floating
alt-f = 'fullscreen'                     # SUPER + F
# ALT + /   back to tiles.  If the screen suddenly shows a single window
#           with padding at the sides, that is accordion; press this.
alt-slash = 'layout tiles'
# ALT + SHIFT + arrows   join this window with its neighbour in that
#           direction so the pair shares one column (or row); four in a
#           row become a 2x2 in two presses. AeroSpace has no automatic
#           grid (dwindle) layout; this is the manual one.
#           Undo: ALT + SHIFT + ;  then  r  (flatten the workspace).
alt-shift-left = 'join-with left'
alt-shift-right = 'join-with right'
alt-shift-up = 'join-with up'
alt-shift-down = 'join-with down'

# --- focus -----------------------------------------------------------------
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'

# --- workspaces ------------------------------------------------------------
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# --- housekeeping ----------------------------------------------------------
# No Hyprland equivalent; AeroSpace has no "exit to login screen".
alt-shift-semicolon = 'mode service'
# Pause/resume tiling. The only bind that still works while tiling is off.
alt-shift-e = 'enable toggle'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
