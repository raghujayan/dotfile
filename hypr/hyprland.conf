# Minimal Hyprland for trying tiling out. GNOME is untouched; SUPER+M
# quits back to the login screen, where the gear icon picks GNOME.

monitor = , preferred, auto, 1.5

$term    = kitty
$menu    = wofi --show drun
$mod     = SUPER

# show the cheatsheet on login so the keys are on screen, not in your head
exec-once = kitty --hold -e cat ~/.config/hypr/KEYS.txt
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee)
    col.inactive_border = rgba(2a2f3aaa)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease
    animation = workspaces, 1, 3, ease
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---- the way out ----
bind = $mod, M, exit,

# ---- basics ----
bind = $mod, Return, exec, $term
bind = $mod, Space,  exec, $menu
bind = $mod, Q,      killactive,
bind = $mod, V,      togglefloating,
bind = $mod, F,      fullscreen,
bind = $mod, H,      exec, $term --hold -e cat ~/.config/hypr/KEYS.txt

# ---- focus ----
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# ---- workspaces ----
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# ---- mouse ----
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---- laptop keys ----
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Cycle fan strategy (fw-fanctrl)
bind = $mod SHIFT, F, exec, ~/.config/hypr/fanctrl-cycle.sh

# Clipboard history picker (cliphist + wofi)
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
